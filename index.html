<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Orbit - Click the Square Game</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- 우주 별 배경 -->
    <div class="stars"></div>
    <div class="shooting-star"></div>
    
    <div class="container">
        <h1>🌌 Orbit</h1>
        <p class="instructions">Click the square when it enters the green zone (50%-85% of the track)</p>
        
        <div class="game-area">
            <div class="track">
                <div id="movingSquare" class="moving-square"></div>
            </div>
            
            <div id="resultArea" class="result-area" style="display: none;">
                <div id="resultMessage" class="result-message"></div>
                <p>Game restarting in: <span id="timer">10</span>s</p>
                <button id="restartBtn" class="restart-btn" title="Click once to restart">Restart Now 🚀</button>
            </div>
        </div>
        
        <!-- 우주 데코레이션 -->
        <div class="space-decoration">
            <div class="planet planet-1">🪐</div>
            <div class="planet planet-2">🌍</div>
            <div class="planet planet-3">🌙</div>
            <div class="comet">☄️</div>
        </div>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
